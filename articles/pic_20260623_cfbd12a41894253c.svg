<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Three.js basic render pipeline</title>
  <desc id="desc">A simple diagram showing geometry and material combining into mesh, then rendered through camera, lights, renderer and GPU.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="360" fill="#ffffff"/>
  <text x="48" y="54" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0f172a">Three.js 的基础渲染链路</text>
  <text x="48" y="86" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">先理解这条线，材质、贴图、UV、着色器会更容易归位。</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="58" y="130" width="150" height="92" rx="8" fill="url(#panel)" stroke="#94a3b8"/>
    <text x="133" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Geometry</text>
    <text x="133" y="192" text-anchor="middle" font-size="15" fill="#475569">形状/顶点/面</text>

    <rect x="58" y="242" width="150" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="133" y="273" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">Material</text>
    <text x="133" y="297" text-anchor="middle" font-size="14" fill="#92400e">表面规则</text>

    <line x1="208" y1="176" x2="305" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="208" y1="278" x2="305" y2="229" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="315" y="164" width="140" height="92" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="385" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">Mesh</text>
    <text x="385" y="226" text-anchor="middle" font-size="15" fill="#166534">可显示物体</text>

    <line x1="455" y1="210" x2="545" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="555" y="130" width="150" height="92" rx="8" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="630" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#075985">Scene</text>
    <text x="630" y="192" text-anchor="middle" font-size="15" fill="#0369a1">物体的世界</text>

    <rect x="555" y="242" width="150" height="72" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="630" y="273" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Camera + Light</text>
    <text x="630" y="297" text-anchor="middle" font-size="14" fill="#5b21b6">视角和光照</text>

    <line x1="705" y1="176" x2="795" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="705" y1="278" x2="795" y2="229" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="805" y="164" width="140" height="92" rx="8" fill="#fee2e2" stroke="#ef4444"/>
    <text x="875" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">Renderer</text>
    <text x="875" y="226" text-anchor="middle" font-size="15" fill="#991b1b">交给 WebGL/GPU</text>

    <line x1="945" y1="210" x2="1010" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1018" y="164" width="54" height="92" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="1045" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">屏幕</text>
    <text x="1045" y="229" text-anchor="middle" font-size="13" fill="#475569">像素</text>
  </g>
</svg>
