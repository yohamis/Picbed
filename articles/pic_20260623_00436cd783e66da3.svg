<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">UV mapping and texture coordinates</title>
  <desc id="desc">A diagram showing a 2D texture coordinate space mapped onto a 3D plane.</desc>
  <defs>
    <pattern id="checker" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#f8fafc"/>
      <rect width="30" height="30" fill="#cbd5e1"/>
      <rect x="30" y="30" width="30" height="30" fill="#cbd5e1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="48" y="54" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0f172a">UV：告诉贴图应该贴到哪里</text>
  <text x="48" y="86" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#475569">U/V 是图片空间里的两个轴，范围通常是 0 到 1。模型顶点会记录它对应图片上的哪个位置。</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="80" y="140" width="330" height="330" fill="url(#checker)" stroke="#0f172a" stroke-width="2"/>
    <text x="245" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">2D 贴图空间</text>
    <line x1="80" y1="470" x2="430" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="80" y1="470" x2="80" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="442" y="477" font-size="18" fill="#0f172a">U</text>
    <text x="72" y="112" font-size="18" fill="#0f172a">V</text>
    <circle cx="80" cy="470" r="5" fill="#ef4444"/>
    <circle cx="410" cy="470" r="5" fill="#ef4444"/>
    <circle cx="410" cy="140" r="5" fill="#ef4444"/>
    <circle cx="80" cy="140" r="5" fill="#ef4444"/>
    <text x="88" y="493" font-size="15" fill="#991b1b">(0,0)</text>
    <text x="370" y="493" font-size="15" fill="#991b1b">(1,0)</text>
    <text x="370" y="132" font-size="15" fill="#991b1b">(1,1)</text>
    <text x="88" y="132" font-size="15" fill="#991b1b">(0,1)</text>

    <line x1="455" y1="305" x2="620" y2="305" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="538" y="284" text-anchor="middle" font-size="16" fill="#475569">按 UV 采样</text>

    <polygon points="690,180 970,125 1015,400 730,452" fill="url(#checker)" stroke="#0f172a" stroke-width="2"/>
    <text x="850" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">3D 表面</text>
    <circle cx="730" cy="452" r="5" fill="#ef4444"/>
    <circle cx="1015" cy="400" r="5" fill="#ef4444"/>
    <circle cx="970" cy="125" r="5" fill="#ef4444"/>
    <circle cx="690" cy="180" r="5" fill="#ef4444"/>
    <text x="672" y="474" font-size="15" fill="#991b1b">UV(0,0)</text>
    <text x="973" y="428" font-size="15" fill="#991b1b">UV(1,0)</text>
    <text x="934" y="112" font-size="15" fill="#991b1b">UV(1,1)</text>
    <text x="628" y="176" font-size="15" fill="#991b1b">UV(0,1)</text>
  </g>
</svg>
